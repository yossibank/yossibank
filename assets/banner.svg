<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
      .chip { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.22); }
      .chipt { fill: #e2e8f0; font-size: 17px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="260" fill="url(#glow1)"/>
  <circle cx="160" cy="320" r="240" fill="url(#glow2)"/>

  <g fill="none" stroke="rgba(255,255,255,0.10)">
    <path d="M0 260 C 320 200, 640 320, 1280 220"/>
    <path d="M0 290 C 360 230, 700 340, 1280 250"/>
  </g>

  <g transform="translate(940 52)">
    <rect x="0" y="0" width="120" height="236" rx="26" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
    <rect x="44" y="10" width="32" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
    <rect x="16" y="40" width="88" height="44" rx="10" fill="rgba(249,115,22,0.55)"/>
    <rect x="16" y="94" width="40" height="40" rx="10" fill="rgba(255,255,255,0.18)"/>
    <rect x="64" y="94" width="40" height="40" rx="10" fill="rgba(255,255,255,0.18)"/>
    <rect x="16" y="144" width="88" height="12" rx="6" fill="rgba(255,255,255,0.18)"/>
    <rect x="16" y="164" width="64" height="12" rx="6" fill="rgba(255,255,255,0.12)"/>
  </g>
  <g transform="translate(1084 92)">
    <rect x="0" y="0" width="112" height="210" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
    <circle cx="56" cy="14" r="4" fill="rgba(255,255,255,0.35)"/>
    <rect x="14" y="32" width="84" height="40" rx="8" fill="rgba(34,211,238,0.45)"/>
    <rect x="14" y="82" width="84" height="12" rx="6" fill="rgba(255,255,255,0.18)"/>
    <rect x="14" y="102" width="60" height="12" rx="6" fill="rgba(255,255,255,0.12)"/>
    <rect x="14" y="122" width="84" height="12" rx="6" fill="rgba(255,255,255,0.18)"/>
  </g>

  <text class="t" x="72" y="128" font-size="76" font-weight="800" fill="url(#name)" letter-spacing="-1">yossibank</text>
  <text class="t" x="76" y="176" font-size="26" fill="#cbd5e1">iOS &amp; Android apps — from idea to the store, built solo.</text>

  <g class="t" transform="translate(76 214)">
    <rect class="chip" x="0" y="0" width="92" height="40" rx="20"/>
    <text class="chipt" x="46" y="26" text-anchor="middle">Swift</text>
    <rect class="chip" x="104" y="0" width="100" height="40" rx="20"/>
    <text class="chipt" x="154" y="26" text-anchor="middle">Kotlin</text>
    <rect class="chip" x="216" y="0" width="112" height="40" rx="20"/>
    <text class="chipt" x="272" y="26" text-anchor="middle">SwiftUI</text>
    <rect class="chip" x="340" y="0" width="176" height="40" rx="20"/>
    <text class="chipt" x="428" y="26" text-anchor="middle">Jetpack Compose</text>
    <rect class="chip" x="528" y="0" width="76" height="40" rx="20"/>
    <text class="chipt" x="566" y="26" text-anchor="middle">KMP</text>
    <rect class="chip" x="616" y="0" width="150" height="40" rx="20"/>
    <text class="chipt" x="691" y="26" text-anchor="middle">Claude Code</text>
